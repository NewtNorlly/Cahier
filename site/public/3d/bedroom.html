<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>文献笔记 · 卧室书房</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(120% 120% at 50% 18%, #16305c 0%, #0d1b33 58%, #08111f 100%);
      font-family: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    #scene {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: grab;
    }
    #scene:active { cursor: grabbing; }
    .hud {
      position: fixed;
      left: 14px;
      bottom: 14px;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 13px;
      border: 1px solid rgba(147, 197, 253, 0.22);
      border-radius: 999px;
      background: rgba(13, 27, 51, 0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #cfe0fb;
      font-size: 12px;
      letter-spacing: 0.04em;
      pointer-events: none;
    }
    .hud .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #60a5fa;
      box-shadow: 0 0 10px #60a5fa;
    }
    .loading {
      position: fixed;
      inset: 0;
      z-index: 4;
      display: grid;
      place-items: center;
      color: #93c5fd;
      font-size: 13px;
      letter-spacing: 0.18em;
      background:
        radial-gradient(120% 120% at 50% 18%, #16305c 0%, #0d1b33 58%, #08111f 100%);
      transition: opacity 0.45s ease;
    }
    .loading[hidden] { display: none; }
    .error {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #fecaca;
      background: rgba(8, 17, 31, 0.92);
      font-size: 13px;
      line-height: 1.8;
      text-align: center;
    }
    .error[hidden] { display: none; }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="卧室书房三维场景：按住拖动可环顾四周"></canvas>

  <div class="hud">
    <span class="dot"></span>
    <span>站在卧室中央 · 按住拖动 / 手指滑动，环顾四周</span>
  </div>

  <div id="loading" class="loading">正在载入卧室场景…</div>
  <div id="error" class="error" hidden>
    <div id="error-text"></div>
  </div>

  <script src="./bedroom.js" defer></script>
</body>
</html>
