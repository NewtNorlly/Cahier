<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>文献笔记 · 书桌</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* 明媚浅天蓝，与站点钴蓝白昼协调 */
      background:
        radial-gradient(120% 120% at 50% 16%, #f4faff 0%, #e4f0fb 56%, #d7e8f7 100%);
      font-family: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    html[data-theme="night"], html[data-theme="night"] body {
      background: radial-gradient(120% 120% at 50% 16%, #161e2e 0%, #0e1420 58%, #0a0f19 100%);
    }
    #scene { display: block; width: 100vw; height: 100vh; cursor: grab; }
    #scene:active { cursor: grabbing; }
    .hud {
      position: fixed;
      left: 14px;
      bottom: 14px;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 13px;
      border: 1px solid rgba(37, 99, 235, 0.16);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #33567a;
      font-size: 12px;
      letter-spacing: 0.04em;
      pointer-events: none;
    }
    html[data-theme="night"] .hud {
      border-color: rgba(147, 197, 253, 0.2);
      background: rgba(14, 20, 32, 0.55);
      color: #c3d4ee;
    }
    .hud .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #4fa8dc;
      box-shadow: 0 0 10px rgba(79, 168, 220, 0.7);
    }
    .loading {
      position: fixed;
      inset: 0;
      z-index: 4;
      display: grid;
      place-items: center;
      color: #4a79a8;
      font-size: 13px;
      letter-spacing: 0.18em;
      background:
        radial-gradient(120% 120% at 50% 16%, #f4faff 0%, #e4f0fb 56%, #d7e8f7 100%);
      transition: opacity 0.45s ease;
    }
    html[data-theme="night"] .loading {
      color: #93c5fd;
      background: radial-gradient(120% 120% at 50% 16%, #161e2e 0%, #0e1420 58%, #0a0f19 100%);
    }
    .loading[hidden] { display: none; }
    .error {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #b3473a;
      background: rgba(255, 255, 255, 0.94);
      font-size: 13px;
      line-height: 1.8;
      text-align: center;
    }
    html[data-theme="night"] .error { color: #fecaca; background: rgba(10, 15, 25, 0.92); }
    .error[hidden] { display: none; }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="书桌三维场景：按住拖动可环绕查看"></canvas>

  <div class="hud">
    <span class="dot"></span>
    <span>一张书桌 · 按住拖动环绕，滚轮缩放</span>
  </div>

  <div id="loading" class="loading">正在载入书桌…</div>
  <div id="error" class="error" hidden>
    <div id="error-text"></div>
  </div>

  <script>
    // 首帧前对齐父页主题，避免暗夜下 iframe 先亮一下
    (function () {
      try {
        var t = parent.document.documentElement.getAttribute('data-theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
      window.addEventListener('message', function (e) {
        if (e.data && e.data.type === 'le-theme' && e.data.theme) {
          document.documentElement.setAttribute('data-theme', e.data.theme);
        }
      });
    })();
  </script>
  <script src="./desk.js" defer></script>
</body>
</html>
