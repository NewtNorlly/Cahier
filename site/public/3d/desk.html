<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>文献笔记 · 3D 场景</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* 柔和中性渐变底，模型加载前即呈现，不随主题切换 */
      background:
        radial-gradient(120% 120% at 50% 16%, #f4f6f8 0%, #e8ecf0 56%, #dde3e9 100%);
      font-family: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    #scene {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: grab;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    #scene.is-ready { opacity: 1; }
    #scene:active { cursor: grabbing; }
    .error {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #b3473a;
      background: rgba(255, 255, 255, 0.94);
      font-size: 13px;
      line-height: 1.8;
      text-align: center;
    }
    .error[hidden] { display: none; }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="三维场景"></canvas>

  <div id="error" class="error" hidden>
    <div id="error-text"></div>
  </div>

  <script src="./desk.js" defer></script>
</body>
</html>
