<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A9E7D1"/>
      <stop offset="1" stop-color="#55C4A5"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F2FAF6"/>
    </linearGradient>
  </defs>
  <!-- 清新薄荷绿圆角底 -->
  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#bg)"/>
  <!-- 笔记本电脑屏幕 -->
  <rect x="98" y="150" width="316" height="222" rx="18" fill="url(#screen)" stroke="#EAF7F1" stroke-width="4"/>
  <!-- 屏幕内：康奈尔横线笔记本页 -->
  <g stroke="#CFE8DD" stroke-width="9" stroke-linecap="round">
    <line x1="136" y1="206" x2="376" y2="206"/>
    <line x1="136" y1="244" x2="376" y2="244"/>
    <line x1="136" y1="282" x2="376" y2="282"/>
  </g>
  <!-- 左侧红线（康奈尔边线） -->
  <line x1="158" y1="186" x2="158" y2="334" stroke="#EFC3B7" stroke-width="9" stroke-linecap="round"/>
  <!-- 屏幕右下角：薄荷绿对勾（完成感） -->
  <path d="M332 296l16 17 30 -34" stroke="#3E9E88" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 笔记本电脑底座（深薄荷色，突出轮廓） -->
  <rect x="66" y="372" width="380" height="34" rx="17" fill="#37A485"/>
  <rect x="86" y="382" width="340" height="14" rx="7" fill="#F2FBF7"/>
  <rect x="232" y="397" width="48" height="8" rx="4" fill="#2E8A74" opacity="0.6"/>
</svg>
