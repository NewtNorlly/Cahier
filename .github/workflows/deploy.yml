name: Deploy Astro site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: 1
  SITE_URL: https://20061018.xyz
  SITE_BASE: /

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node (probe)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Probe Linux build (capture real error)
        continue-on-error: true
        working-directory: ./site
        shell: bash
        env:
          SITE_URL: https://20061018.xyz
          SITE_BASE: /
          ASTRO_TELEMETRY_DISABLED: 1
        run: |
          set +e
          npm install --no-audit --no-fund > /tmp/install.log 2>&1
          echo "install exit: $?"
          tail -n 5 /tmp/install.log
          npm run build > /tmp/build.log 2>&1
          code=$?
          echo "build exit: $code"
          echo "===== last 100 build log lines ====="
          tail -n 100 /tmp/build.log
          if [ $code -ne 0 ]; then
            echo "===== error annotations ====="
            grep -nEi "error|failed|cannot|enoent|not found|exception|throw|missing|✖|⨯|ELIFECYCLE" /tmp/build.log | tail -n 40 | while IFS= read -r l; do echo "::error title=LinuxBuild::$l"; done
          fi
          exit 0

      - name: Build Astro site
        uses: withastro/action@v6
        with:
          path: ./site
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
